name: Build GT-AX11000 firmware

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model target (make goal)'
        required: false
        default: 'gt-ax11000'
      build_rogui:
        description: 'Also build ROG UI image'
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build ${{ inputs.model || 'gt-ax11000' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    # Gnuton's image: Ubuntu 20.04 + gcc-5.3 HND toolchain + all build deps,
    # /bin/sh -> bash already set. Same image his own CI uses for src-rt-5.02axhnd.
    container:
      image: gnuton/asuswrt-merlin-toolchains-docker:latest
      options: --user root
      volumes:
        - /mnt:/project   # /mnt is the bigger partition on GH runners
      env:
        MODEL: ${{ inputs.model || 'gt-ax11000' }}
        BUILD_ROGUI: ${{ inputs.build_rogui && 'y' || 'n' }}

    defaults:
      run:
        # Build system refuses to run as root; drop to the image's 'docker' user
        shell: gosu docker bash --noprofile --norc -e -o pipefail {0}

    steps:
      - name: Fix permissions (as root)
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          mkdir -p /project/repo /project/artifacts
          chown -R docker:docker /github/home /home/docker /project

      - name: Show toolchain env (as docker user)
        run: |
          source /home/docker/envs/bcm-hnd.sh
          echo "TOOLCHAIN_BASE=$TOOLCHAIN_BASE"
          ls /opt/toolchains/ | head
          /opt/toolchains/crosstools-arm-gcc-5.3-linux-4.1-glibc-2.22-binutils-2.25/usr/bin/arm-buildroot-linux-gnueabi-gcc --version | head -1

      - name: Fetch firmware source (branch with UPnP fix)
        run: |
          cd /project
          rm -rf repo
          git clone --depth 1 --branch gt-ax11000-388.12_2-upnpfix \
            "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git log --oneline -3
          # sanity: UPnP fix present?
          grep -q "INVALID (must be between 1 and 5 incl.)" \
            release/src/router/miniupnpd/minissdp.c \
            && echo "UPnP CVE-2026-107159 fix: PRESENT" \
            || { echo "::error::UPnP fix missing!"; exit 1; }

      - name: Build firmware
        run: |
          source /home/docker/envs/bcm-hnd.sh
          cd /project/repo/release/src-rt-5.02axhnd
          make "$MODEL" 2>&1 | tee build.log | tail -30
          test -d image || { echo "::error::Build failed"; tail -100 build.log; exit 1; }

      - name: Build ROG UI image
        if: ${{ inputs.build_rogui }}
        run: |
          source /home/docker/envs/bcm-hnd.sh
          cd /project/repo/release/src-rt-5.02axhnd
          sed -i 's/ROG_UI=n/ROG_UI=y/' target.mak || true
          rm -rf image/*.pkgtb image/*.w .config
          make "$MODEL" 2>&1 | tee build-rogui.log | tail -30 \
            || echo "::warning::ROG UI build failed"

      - name: Collect artifacts (default UI)
        run: |
          # Save the default-UI image BEFORE the ROG rebuild wipes image/
          mkdir -p /project/artifacts
          cd /project/repo/release/src-rt-5.02axhnd/image 2>/dev/null || exit 0
          rm -f *_cferom_ubi.w
          cp -v *_ubi.w /project/artifacts/ 2>/dev/null || true
          cp -v *.trx /project/artifacts/ 2>/dev/null || true
          ls -la /project/artifacts/

      - name: Collect artifacts (ROG UI)
        if: ${{ inputs.build_rogui }}
        run: |
          cd /project/repo/release/src-rt-5.02axhnd/image 2>/dev/null || exit 0
          rm -f *_cferom_ubi.w
          cp -v *_ubi.w /project/artifacts/ 2>/dev/null || true
          cp -v *.trx /project/artifacts/ 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd /project/artifacts
          for f in *.w *.trx; do
            [ -f "$f" ] && sha256sum "$f" >> sha256sums.txt
          done
          cat sha256sums.txt
          ls -la

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: gt-ax11000-firmware
          path: /project/artifacts/
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            /project/repo/release/src-rt-5.02axhnd/build.log
            /project/repo/release/src-rt-5.02axhnd/build-rogui.log
          if-no-files-found: ignore
